<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — UniVerse ICOS</title>
  <style>
    /* Self-contained: no external assets. The SW serves this page when a
       navigation fails, so it must render with zero network requests. */
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #020617;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
      margin: 0 auto 20px;
    }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 10px; }
    p { font-size: 14px; line-height: 1.6; color: #94a3b8; margin-bottom: 8px; }
    button {
      margin-top: 20px;
      background: #22c55e;
      color: #020617;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { background: #16a34a; }
  </style>
</head>
<body>
  <main class="card">
    <div class="dot" aria-hidden="true"></div>
    <h1>You're offline</h1>
    <p>UniVerse ICOS needs a connection to load your campus — feeds, chats, and study content all live online, by design.</p>
    <p>Check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
